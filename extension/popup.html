<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 14px; width: 260px; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  button.primary {
    width: 100%; padding: 8px; font: inherit; font-weight: 500;
    border: 0; border-radius: 7px; background: #d4322c; color: #fff; cursor: pointer;
  }
  button.primary:disabled { opacity: .45; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .row label { flex: 1; }
  .host { font-weight: 600; word-break: break-all; }
  .muted { color: color-mix(in srgb, currentColor 55%, transparent); }
  .status { margin-top: 10px; min-height: 15px; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>Open in Apple News</h1>
  <button class="primary" id="open">Open this page in News</button>
  <div class="status muted" id="status"></div>
  <div class="row">
    <label for="always">Always for <span class="host" id="host">this site</span></label>
    <input type="checkbox" id="always">
  </div>
  <div class="row">
    <label for="enabled">Automatic redirect</label>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row muted"><a href="#" id="options">Manage publishers…</a></div>
  <script src="popup.js"></script>
</body>
</html>
