name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0). Builds artifacts without publishing a release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Same reason as CI: the project format is newer than the runner default.
      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenInNews-${{ steps.version.outputs.version }}
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/checksums.txt

      # A tag creates a DRAFT. Runner-built assets are ad-hoc signed and not
      # notarized, so they are a placeholder: replace them with locally signed
      # ones (see the README) before publishing the draft.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          Pre-built downloads for macOS, signed with a Developer ID certificate
          and notarized by Apple. Building from source works too — see the
          README — but these save you the Xcode step.

          ### Chrome

          ```sh
          tar -xzf OpenInNews-chrome-VERSION.tar.gz
          cd OpenInNews-chrome-VERSION
          ./install.sh
          ```

          Then load the `extension` folder at `chrome://extensions` with
          Developer mode on, and leave the folder where it is — Chrome reloads
          it from that path every launch.

          ### Safari

          ```sh
          unzip OpenInNews-safari-VERSION.zip
          mv "Open in News.app" /Applications/
          ```

          Launch it, click **Quit and Open Safari Extensions Preferences…**,
          tick **Open in Apple News**, and set its site access to **Allow on
          Every Website**.

          Verify what you downloaded against `checksums.txt`.
          NOTES
          sed -i '' "s/VERSION/$VERSION/g" /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            build/release/*.tar.gz build/release/*.zip build/release/checksums.txt

      - name: Remind to replace assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Draft release created"
            echo
            echo "Its assets are **ad-hoc signed and not notarized** — a hosted"
            echo "runner has no Apple certificate. Replace them before publishing:"
            echo
            echo '```sh'
            echo "NOTARY_PROFILE=NewsOpen ./scripts/package-release.sh $VERSION"
            echo "gh release upload $GITHUB_REF_NAME --clobber build/release/OpenInNews-*.tar.gz \\"
            echo "  build/release/OpenInNews-*.zip build/release/checksums.txt"
            echo "gh release edit $GITHUB_REF_NAME --draft=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
