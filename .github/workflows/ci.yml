name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The project is authored in a newer Xcode than the runner default, and
      # xcodebuild refuses a project format it does not know. Taking the newest
      # installed keeps that failure one Xcode release further away.
      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Stage extensions
        run: |
          ./scripts/stage.sh safari
          ./scripts/stage.sh chrome

      - name: Validate manifests
        run: |
          for m in build/safari/extension/manifest.json build/chrome/extension/manifest.json; do
            python3 -c "import json,sys; json.load(open('$m')); print('ok: $m')"
          done

      - name: Syntax-check extension JavaScript
        run: |
          for f in extension/background.js extension/popup.js extension/options.js extension/publishers.js; do
            node --check "$f"
          done

      # Builds the host and the Safari app by the same path a release uses, so a
      # break in packaging shows up here rather than at tag time.
      - name: Package release artifacts
        run: ./scripts/package-release.sh

      - name: Check artifacts are universal
        run: |
          set -euo pipefail
          tar -xzf build/release/OpenInNews-chrome-*.tar.gz -C build/release
          for b in build/release/OpenInNews-chrome-*/newsopen-host; do
            lipo -info "$b" | grep -q 'x86_64 arm64' || { lipo -info "$b"; exit 1; }
          done
          echo "ok: host is universal"
